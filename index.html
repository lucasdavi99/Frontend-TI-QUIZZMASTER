<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/Vector 1.png" type="image/x-icon" />
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/pages/home.css" />
    
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/baffle@0.3.6/dist/baffle.min.js"></script>
    
    <title>T.I QUIZZMASTER</title>
  </head>

  <body>
    <!-- Matrix Rain Background -->
    <canvas id="canvas"></canvas>
    
    <!-- Main Container -->
    <div class="container">
      <!-- Title with Glitch Effect -->
      <div class="title-container">
        <h1 id="titulo" class="glitch-title" data-text="T.I QUIZZMASTER">
          <span class="glitch-layer">T.I QUIZZMASTER</span>
        </h1>
      </div>
      
      <!-- Navigation Buttons -->
      <nav class="navigation">
        <a class="btn btn-primary" href="questions.html">
          <span class="btn-text">Começar</span>
          <span class="btn-bg"></span>
        </a>
        <a class="btn btn-secondary" href="rank.html">
          <span class="btn-text">Ranking</span>
          <span class="btn-bg"></span>
        </a>
        <a class="btn btn-tertiary" href="credit.html">
          <span class="btn-text">Creditos</span>
          <span class="btn-bg"></span>
        </a>
      </nav>
    </div>

    <!-- Login/Logout Button -->
    <div class="auth-container">
      <a href="login.html" id="login" class="auth-btn">
        <img id="loginImage" src="img/login-image.png" alt="login" />
        <span class="auth-tooltip">Login</span>
      </a>
    </div>

    <!-- Audio -->
    <audio id="backgroundAudio" autoplay loop>
      <source src="audio/Spektrem_Shine.mp3" />
    </audio>

    <!-- JavaScript Files -->
    <script src="js/rain_code.js"></script>
    <script src="js/glitch-effects.js"></script>
    <script src="js/auth-handler.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
