<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="img/Vector 1.png" type="image/x-icon">
  <link rel="stylesheet" href="css/code_rain.css">
  <link rel="stylesheet" href="css/questions.css">
  <link rel="stylesheet" href="css/modal.css">
  <title>T.I QUIZZMASTER</title>
</head>

<!--Rain code-->
<body> 
  <div class="container">
    <canvas id="canvas"></canvas>
  </div>
  
  <div class="container-terminal">
    <div class="terminal">
      <h1 class="pergunta" id="Questao">Carregando pergunta...</h1>
    </div>

    <!-- Score Display -->
    <div class="score-display">
        <p>Pontuação: <span id="current-score">0</span></p>
        <p>Pergunta <span id="current-question-number">1</span> de <span id="total-questions">10</span></p>
    </div>
  </div>
  
  <div class="grid-container">
    <div class="box"><p id="answer_a">Carregando...</p></div>
    <div class="box"><p id="answer_b">Carregando...</p></div>
    <div class="box"><p id="answer_c">Carregando...</p></div>
    <div class="box"><p id="answer_d">Carregando...</p></div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="progress-text">
      <span id="progress-percentage">0%</span>
    </div>
  </div>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p id="modalText"></p>
    </div>
  </div>

  <a href="index.html" id="back-home2">
    <img src="img/duas-setas-para-a-esquerda.png" alt="Voltar para a página principal">
  </a>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p>Carregando quiz...</p>
    </div>
  </div>
  
  <script src="js/rain_code.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/modal.js"></script>
</body>

</html>
